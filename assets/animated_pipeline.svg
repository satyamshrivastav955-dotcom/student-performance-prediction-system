<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#090d16; border-radius:16px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="node-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="accent-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .flow-line {
      stroke-dasharray: 8 8;
      animation: dash 1.5s linear infinite;
    }
    .flow-line-reverse {
      stroke-dasharray: 8 8;
      animation: dash-reverse 1.5s linear infinite;
    }
    .pulse-node {
      animation: pulse 3s ease-in-out infinite;
    }
    .pulse-badge {
      animation: badge-glow 2s ease-in-out infinite;
    }
    @keyframes dash {
      from { stroke-dashoffset: 32; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes dash-reverse {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 32; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 4px rgba(56,189,248,0.2)); }
      50% { opacity: 1; filter: drop-shadow(0 0 16px rgba(56,189,248,0.6)); }
    }
    @keyframes badge-glow {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    .tag { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
    .title { font-size: 14px; font-weight: 700; fill: #f8fafc; }
    .subtext { font-size: 11.5px; fill: #94a3b8; font-weight: 400; }
    .metric { font-family: 'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; font-size: 11px; font-weight: 600; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="680" fill="url(#bg-grad)" rx="16" stroke="#1e293b" stroke-width="1.5" />

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.08">
    <path d="M 0 68 L 1200 68 M 0 136 L 1200 136 M 0 204 L 1200 204 M 0 272 L 1200 272 M 0 340 L 1200 340 M 0 408 L 1200 408 M 0 476 L 1200 476 M 0 544 L 1200 544 M 0 612 L 1200 612" stroke="#38bdf8" stroke-width="1" />
    <path d="M 120 0 L 120 680 M 240 0 L 240 680 M 360 0 L 360 680 M 480 0 L 480 680 M 600 0 L 600 680 M 720 0 L 720 680 M 840 0 L 840 680 M 960 0 L 960 680 M 1080 0 L 1080 680" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Header Section -->
  <g transform="translate(50, 42)">
    <rect x="0" y="0" width="1100" height="46" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <circle cx="24" cy="23" r="6" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="40" y="27" font-size="13" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">STUDENT PERFORMANCE PREDICTION &amp; AUDIT PIPELINE</text>
    <text x="600" y="27" font-size="12" fill="#64748b" font-weight="500">CLASSICAL ENSEMBLE ML · TREE-SHAP · DiCE COUNTERFACTUALS · FAIRLEARN ETHICS · REST &amp; STREAMLIT</text>
    <rect x="1005" y="12" width="80" height="22" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="1045" y="27" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">v2.4 PROD</text>
  </g>

  <!-- Flow Paths / Connecting Lines -->
  <!-- Layer 1 to Layer 2 -->
  <path d="M 230 200 L 290 200" stroke="#38bdf8" stroke-width="2.5" class="flow-line" />
  <path d="M 230 380 L 260 380 L 260 230 L 290 230" stroke="#38bdf8" stroke-width="2" class="flow-line" opacity="0.7" />
  <path d="M 230 520 L 270 520 L 270 250 L 290 250" stroke="#38bdf8" stroke-width="2" class="flow-line" opacity="0.6" />

  <!-- Layer 2 to Layer 3 (Arena) -->
  <path d="M 470 220 L 530 180" stroke="#818cf8" stroke-width="2" class="flow-line" />
  <path d="M 470 220 L 530 270" stroke="#10b981" stroke-width="2.5" class="flow-line" />
  <path d="M 470 220 L 530 360" stroke="#818cf8" stroke-width="2" class="flow-line" />
  <path d="M 470 220 L 530 450" stroke="#818cf8" stroke-width="2" class="flow-line" />

  <!-- Layer 3 (Best Model) to Layer 4 (Explainability & Fairness) -->
  <path d="M 720 270 L 780 180" stroke="#10b981" stroke-width="2.5" class="flow-line" />
  <path d="M 720 270 L 780 290" stroke="#10b981" stroke-width="2.5" class="flow-line" />
  <path d="M 720 270 L 780 400" stroke="#10b981" stroke-width="2.5" class="flow-line" />
  <path d="M 720 270 L 780 510" stroke="#10b981" stroke-width="2.5" class="flow-line" />

  <!-- Layer 4 to Layer 5 (Serving & Dashboards) -->
  <path d="M 960 180 L 1000 180 L 1000 240 L 1020 240" stroke="#06b6d4" stroke-width="2" class="flow-line" />
  <path d="M 960 290 L 990 290 L 990 260 L 1020 260" stroke="#10b981" stroke-width="2" class="flow-line" />
  <path d="M 960 400 L 990 400 L 990 420 L 1020 420" stroke="#f59e0b" stroke-width="2" class="flow-line" />
  <path d="M 960 510 L 1000 510 L 1000 440 L 1020 440" stroke="#d946ef" stroke-width="2" class="flow-line" />

  <!-- LAYER 1: MULTI-MODAL DATA TELEMETRY -->
  <g transform="translate(50, 115)">
    <!-- Column Header -->
    <text x="0" y="0" class="tag" fill="#38bdf8">01 · INGESTION LAYER</text>

    <!-- Node 1A: LMS Telemetry -->
    <g transform="translate(0, 15)" class="pulse-node" filter="url(#drop-shadow)">
      <rect width="180" height="110" rx="10" fill="url(#node-blue)" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="0" y="0" width="180" height="4" fill="url(#accent-cyan)" rx="2" />
      <text x="14" y="24" class="title">xAPI LMS Logs</text>
      <text x="14" y="42" class="subtext">478 Students · 16 Attributes</text>
      <text x="14" y="62" class="subtext">· raisedhands (0-100)</text>
      <text x="14" y="78" class="subtext">· VisITedResources (0-100)</text>
      <text x="14" y="94" class="subtext">· Announcements &amp; Discussion</text>
    </g>

    <!-- Node 1B: Demographic & Academic Context -->
    <g transform="translate(0, 145)" filter="url(#drop-shadow)">
      <rect width="180" height="110" rx="10" fill="url(#node-blue)" stroke="#334155" stroke-width="1.2" />
      <text x="14" y="24" class="title">Academic &amp; Demographics</text>
      <text x="14" y="42" class="subtext">Contextual &amp; Cohort Features</text>
      <text x="14" y="62" class="subtext">· StageID &amp; GradeLevel</text>
      <text x="14" y="78" class="subtext">· SectionID &amp; Semester</text>
      <text x="14" y="94" class="subtext">· Topic (12 Core Disciplines)</text>
    </g>

    <!-- Node 1C: Behavioral & Household -->
    <g transform="translate(0, 275)" filter="url(#drop-shadow)">
      <rect width="180" height="110" rx="10" fill="url(#node-blue)" stroke="#334155" stroke-width="1.2" />
      <text x="14" y="24" class="title">Engagement &amp; Survey</text>
      <text x="14" y="42" class="subtext">Attendance &amp; Household Logs</text>
      <text x="14" y="62" class="subtext">· StudentAbsenceDays (V=0.68)</text>
      <text x="14" y="78" class="subtext">· ParentAnsweringSurvey</text>
      <text x="14" y="94" class="subtext">· ParentschoolSatisfaction</text>
    </g>
  </g>

  <!-- LAYER 2: LEAK-FREE PREPROCESSING & VALIDATION -->
  <g transform="translate(290, 115)">
    <text x="0" y="0" class="tag" fill="#818cf8">02 · LEAK-FREE TRANSFORM</text>

    <g transform="translate(0, 15)" filter="url(#drop-shadow)">
      <rect width="180" height="370" rx="10" fill="url(#node-blue)" stroke="#818cf8" stroke-width="1.5" />
      <rect x="0" y="0" width="180" height="4" fill="url(#accent-purple)" rx="2" />
      <text x="14" y="28" class="title">ColumnTransformer</text>
      <text x="14" y="48" class="subtext">Zero Data Leakage Pipeline</text>

      <!-- Substep 1 -->
      <g transform="translate(12, 65)">
        <rect width="156" height="54" rx="6" fill="#0f172a" stroke="#1e293b" />
        <text x="10" y="18" font-size="11" font-weight="700" fill="#c084fc">Robust Scaling</text>
        <text x="10" y="34" font-size="10" fill="#94a3b8">Median &amp; IQR Normalization</text>
        <text x="10" y="46" class="metric" fill="#38bdf8">4 Numeric Features</text>
      </g>

      <!-- Substep 2 -->
      <g transform="translate(12, 130)">
        <rect width="156" height="54" rx="6" fill="#0f172a" stroke="#1e293b" />
        <text x="10" y="18" font-size="11" font-weight="700" fill="#c084fc">Ordinal Encoding</text>
        <text x="10" y="34" font-size="10" fill="#94a3b8">Preserve Natural Progression</text>
        <text x="10" y="46" class="metric" fill="#38bdf8">StageID, GradeID, Target</text>
      </g>

      <!-- Substep 3 -->
      <g transform="translate(12, 195)">
        <rect width="156" height="54" rx="6" fill="#0f172a" stroke="#1e293b" />
        <text x="10" y="18" font-size="11" font-weight="700" fill="#c084fc">One-Hot Encoding</text>
        <text x="10" y="34" font-size="10" fill="#94a3b8">drop='first' Multicollinearity</text>
        <text x="10" y="46" class="metric" fill="#38bdf8">10 Categorical Features</text>
      </g>

      <!-- Substep 4 -->
      <g transform="translate(12, 260)">
        <rect width="156" height="88" rx="6" fill="#0f172a" stroke="#1e293b" />
        <text x="10" y="18" font-size="11" font-weight="700" fill="#c084fc">Stratified 5-Fold CV</text>
        <text x="10" y="34" font-size="10" fill="#94a3b8">Balanced F1-Macro Objective</text>
        <text x="10" y="50" font-size="10" fill="#94a3b8">Train: 382 | Holdout Test: 96</text>
        <rect x="10" y="60" width="136" height="20" rx="4" fill="#1e1b4b" />
        <text x="78" y="74" font-size="9.5" font-weight="700" fill="#a78bfa" text-anchor="middle">SEED: 42 (DETERMINISTIC)</text>
      </g>
    </g>
  </g>

  <!-- LAYER 3: CLASSICAL MODEL ARENA & STATISTICAL SELECTION -->
  <g transform="translate(530, 115)">
    <text x="0" y="0" class="tag" fill="#10b981">03 · MODEL ARENA (NO DEEP LEARNING)</text>

    <!-- Model 1: Logistic Regression -->
    <g transform="translate(0, 15)" filter="url(#drop-shadow)">
      <rect width="190" height="52" rx="8" fill="url(#node-blue)" stroke="#334155" stroke-width="1" />
      <text x="12" y="20" font-size="12" font-weight="600" fill="#cbd5e1">Logistic Regression</text>
      <text x="12" y="38" class="metric" fill="#64748b">Acc: 73.96% · F1: 0.7477</text>
    </g>

    <!-- Model 2: Random Forest (CHAMPION) -->
    <g transform="translate(0, 78)" class="pulse-node" filter="url(#drop-shadow)">
      <rect width="190" height="116" rx="10" fill="#062d22" stroke="#10b981" stroke-width="2" />
      <rect x="0" y="0" width="190" height="4" fill="url(#accent-emerald)" rx="2" />
      <rect x="105" y="10" width="75" height="18" rx="4" fill="#065f46" />
      <text x="142" y="23" font-size="9" font-weight="800" fill="#34d399" text-anchor="middle">CHAMPION</text>
      <text x="12" y="24" class="title" fill="#34d399">Random Forest</text>
      <text x="12" y="44" class="subtext">200 Estimators · Entropy Split</text>
      
      <g transform="translate(10, 52)">
        <rect width="170" height="52" rx="6" fill="#022c22" stroke="#047857" />
        <text x="8" y="17" class="metric" fill="#a7f3d0">Test Accuracy:  82.29%</text>
        <text x="8" y="32" class="metric" fill="#a7f3d0">Macro-F1 Score: 0.8282</text>
        <text x="8" y="46" class="metric" fill="#6ee7b7">Severe Errors:  0 / 96 (0.0%)</text>
      </g>
    </g>

    <!-- Model 3: Decision Tree -->
    <g transform="translate(0, 206)" filter="url(#drop-shadow)">
      <rect width="190" height="52" rx="8" fill="url(#node-blue)" stroke="#334155" stroke-width="1" />
      <text x="12" y="20" font-size="12" font-weight="600" fill="#cbd5e1">Decision Tree (Pruned)</text>
      <text x="12" y="38" class="metric" fill="#64748b">Acc: 69.79% · F1: 0.7086</text>
    </g>

    <!-- Model 4: Gradient Boosting -->
    <g transform="translate(0, 269)" filter="url(#drop-shadow)">
      <rect width="190" height="52" rx="8" fill="url(#node-blue)" stroke="#334155" stroke-width="1" />
      <text x="12" y="20" font-size="12" font-weight="600" fill="#cbd5e1">Gradient Boosting</text>
      <text x="12" y="38" class="metric" fill="#64748b">Acc: 70.83% · F1: 0.7172</text>
    </g>

    <!-- Statistical Proof Callout -->
    <g transform="translate(0, 332)" filter="url(#drop-shadow)">
      <rect width="190" height="52" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
      <text x="10" y="18" font-size="10.5" font-weight="700" fill="#c7d2fe">McNemar's Paired Test</text>
      <text x="10" y="34" font-size="9.5" fill="#a5b4fc">p &lt; 0.05 statistically validated</text>
      <text x="10" y="45" font-size="9" fill="#818cf8">Bootstrapped 95% CI: [0.75, 0.89]</text>
    </g>
  </g>

  <!-- LAYER 4: EXPLAINABILITY, COUNTERFACTUALS & ETHICS -->
  <g transform="translate(780, 115)">
    <text x="0" y="0" class="tag" fill="#f59e0b">04 · EXPLAINABILITY &amp; ETHICS</text>

    <!-- Node 4A: TreeSHAP Attribution -->
    <g transform="translate(0, 15)" filter="url(#drop-shadow)">
      <rect width="180" height="88" rx="8" fill="url(#node-blue)" stroke="#f59e0b" stroke-width="1.2" />
      <rect x="0" y="0" width="180" height="3" fill="url(#accent-amber)" rx="1.5" />
      <text x="12" y="20" class="title">TreeSHAP Attribution</text>
      <text x="12" y="38" class="subtext">Exact Shapley Game Theory</text>
      <text x="12" y="55" class="metric" fill="#fbbf24">#1 Absence (28.5%)</text>
      <text x="12" y="71" class="metric" fill="#fcd34d">#2 Resources (20.2%)</text>
    </g>

    <!-- Node 4B: Actionable Counterfactuals (DiCE) -->
    <g transform="translate(0, 115)" filter="url(#drop-shadow)">
      <rect width="180" height="98" rx="8" fill="url(#node-blue)" stroke="#38bdf8" stroke-width="1.2" />
      <rect x="0" y="0" width="180" height="3" fill="url(#accent-cyan)" rx="1.5" />
      <text x="12" y="20" class="title">DiCE Counterfactuals</text>
      <text x="12" y="36" class="subtext">"What minimum effort flips L→M?"</text>
      <text x="12" y="54" font-size="10" fill="#38bdf8">· Frozen Protected Attributes</text>
      <text x="12" y="70" font-size="10" fill="#94a3b8">· Gender &amp; Nationality Locked</text>
      <text x="12" y="86" class="metric" fill="#7dd3fc">Median Changes: 1.0 Step</text>
    </g>

    <!-- Node 4C: Fairlearn Demographic Parity -->
    <g transform="translate(0, 225)" filter="url(#drop-shadow)">
      <rect width="180" height="88" rx="8" fill="url(#node-blue)" stroke="#10b981" stroke-width="1.2" />
      <rect x="0" y="0" width="180" height="3" fill="url(#accent-emerald)" rx="1.5" />
      <text x="12" y="20" class="title">Fairlearn Bias Audit</text>
      <text x="12" y="36" class="subtext">Demographic Parity &amp; Eq. Odds</text>
      <text x="12" y="54" class="metric" fill="#34d399">Parity Ratio: 0.982 (Fair)</text>
      <text x="12" y="70" class="metric" fill="#6ee7b7">Parity Diff:  0.008 (&lt; 0.05)</text>
    </g>

    <!-- Node 4D: Monte Carlo Simulator -->
    <g transform="translate(0, 325)" filter="url(#drop-shadow)">
      <rect width="180" height="60" rx="8" fill="url(#node-blue)" stroke="#d946ef" stroke-width="1.2" />
      <text x="12" y="20" class="title">Monte Carlo Simulator</text>
      <text x="12" y="36" class="subtext">500 Stochastic Cohort Runs</text>
      <text x="12" y="50" class="metric" fill="#f472b6">+15% Active → +7.7pp High</text>
    </g>
  </g>

  <!-- LAYER 5: DUAL-SURFACE SERVING & DELIVERY -->
  <g transform="translate(1020, 115)">
    <text x="0" y="0" class="tag" fill="#38bdf8">05 · SERVING LAYER</text>

    <!-- Node 5A: FastAPI Microservice -->
    <g transform="translate(0, 45)" filter="url(#drop-shadow)">
      <rect width="130" height="140" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
      <rect x="0" y="0" width="130" height="4" fill="url(#accent-cyan)" rx="2" />
      <text x="12" y="24" class="title" fill="#38bdf8">FastAPI</text>
      <text x="12" y="42" class="subtext">REST Sub-10ms</text>
      <text x="12" y="64" font-size="10" fill="#94a3b8">· /predict</text>
      <text x="12" y="80" font-size="10" fill="#94a3b8">· /explain</text>
      <text x="12" y="96" font-size="10" fill="#94a3b8">· /health</text>
      <rect x="12" y="108" width="106" height="20" rx="4" fill="#164e63" />
      <text x="65" y="122" font-size="9" font-weight="700" fill="#22d3ee" text-anchor="middle">Pydantic v2</text>
    </g>

    <!-- Node 5B: Streamlit Multi-Page UI -->
    <g transform="translate(0, 220)" filter="url(#drop-shadow)">
      <rect width="130" height="165" rx="10" fill="#0f172a" stroke="#ff4b4b" stroke-width="1.5" />
      <rect x="0" y="0" width="130" height="4" fill="#ff4b4b" rx="2" />
      <text x="12" y="24" class="title" fill="#f87171">Streamlit</text>
      <text x="12" y="42" class="subtext">5 Interactive Pages</text>
      <text x="12" y="64" font-size="9.5" fill="#94a3b8">1. Overview</text>
      <text x="12" y="80" font-size="9.5" fill="#94a3b8">2. Predictor</text>
      <text x="12" y="96" font-size="9.5" fill="#94a3b8">3. What-If Tool</text>
      <text x="12" y="112" font-size="9.5" fill="#94a3b8">4. Cohort Sim</text>
      <text x="12" y="128" font-size="9.5" fill="#94a3b8">5. Fairness Hub</text>
      <rect x="12" y="136" width="106" height="18" rx="4" fill="#450a0a" />
      <text x="65" y="149" font-size="8.5" font-weight="700" fill="#fca5a5" text-anchor="middle">SHAP Waterfall</text>
    </g>
  </g>

  <!-- Bottom Execution Status Bar -->
  <g transform="translate(50, 600)">
    <rect width="1100" height="48" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />
    <g transform="translate(24, 28)">
      <circle cx="0" cy="0" r="5" fill="#10b981" />
      <text x="14" y="4" font-size="12" font-weight="600" fill="#e2e8f0">43 / 43 Pytest Unit &amp; Integration Tests Passing (100%)</text>
    </g>
    <g transform="translate(490, 28)">
      <circle cx="0" cy="0" r="5" fill="#38bdf8" />
      <text x="14" y="4" font-size="12" font-weight="600" fill="#e2e8f0">100% Agreement Between API &amp; Dashboard Engines</text>
    </g>
    <g transform="translate(940, 28)">
      <circle cx="0" cy="0" r="5" fill="#a855f7" />
      <text x="14" y="4" font-size="12" font-weight="600" fill="#e2e8f0">0 Severe Errors (0.0%)</text>
    </g>
  </g>
</svg>
