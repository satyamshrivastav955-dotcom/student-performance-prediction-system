<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%" style="background:#090d16; border-radius:16px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="banner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .beacon {
      animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse-ring {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.15); }
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="240" rx="16" fill="url(#banner-bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Abstract Tech Grid Lines -->
  <g opacity="0.07">
    <path d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180" stroke="#38bdf8" stroke-width="1" />
    <path d="M 200 0 L 200 240 M 400 0 L 400 240 M 600 0 L 600 240 M 800 0 L 800 240 M 1000 0 L 1000 240" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Ambient Glow Circles -->
  <circle cx="150" cy="120" r="90" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="1050" cy="120" r="100" fill="#818cf8" opacity="0.08" filter="url(#glow)" />

  <!-- Status Pill -->
  <g transform="translate(60, 38)">
    <rect width="270" height="26" rx="13" fill="#062d22" stroke="#059669" stroke-width="1" />
    <circle cx="16" cy="13" r="4.5" fill="#10b981" class="beacon" />
    <text x="30" y="17.5" font-size="11" font-weight="700" fill="#34d399" letter-spacing="0.8">PRODUCTION-GRADE ML SYSTEM</text>
  </g>

  <!-- Title -->
  <text x="60" y="112" font-size="34" font-weight="900" fill="url(#text-grad)" letter-spacing="-0.5">
    STUDENT PERFORMANCE INTELLIGENCE
  </text>

  <!-- Subtitle -->
  <text x="60" y="148" font-size="15" font-weight="500" fill="#94a3b8">
    Beyond Black-Box Accuracy: Classical Ensemble ML · Game-Theoretic SHAP · Actionable Counterfactuals · Algorithmic Fairness Audit
  </text>

  <!-- Metrics / Badges Row -->
  <g transform="translate(60, 175)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="135" height="34" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="21" font-size="11.5" font-weight="700" fill="#e2e8f0">82.3% <tspan fill="#64748b" font-weight="500">ACCURACY</tspan></text>

    <!-- Metric 2 -->
    <rect x="145" y="0" width="140" height="34" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="21" font-size="11.5" font-weight="700" fill="#e2e8f0">0.828 <tspan fill="#64748b" font-weight="500">MACRO-F1</tspan></text>

    <!-- Metric 3 -->
    <rect x="295" y="0" width="165" height="34" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="21" font-size="11.5" font-weight="700" fill="#10b981">0 SEVERE ERRORS</text>

    <!-- Metric 4 -->
    <rect x="470" y="0" width="175" height="34" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="21" font-size="11.5" font-weight="700" fill="#38bdf8">SUB-10MS INFERENCE</text>

    <!-- Metric 5 -->
    <rect x="655" y="0" width="190" height="34" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="21" font-size="11.5" font-weight="700" fill="#a78bfa">DEMOGRAPHIC PARITY 0.98</text>
  </g>
</svg>
